<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="Metalboxes — emballages métalliques personnalisés">
  <defs>
    <radialGradient id="etain" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#C9CDD4"/>
      <stop offset="75%" stop-color="#9AA0AC"/>
      <stop offset="100%" stop-color="#7C8290"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8EAEE"/>
      <stop offset="45%" stop-color="#8A909C"/>
      <stop offset="70%" stop-color="#DDE0E5"/>
      <stop offset="100%" stop-color="#8A909C"/>
    </linearGradient>
    <radialGradient id="verm" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#C9453B"/>
      <stop offset="100%" stop-color="#9E2F26"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;display=swap');
      .wordmark { font-family:'Fraunces', Georgia, 'Times New Roman', serif; font-weight:600; }
      .tagline  { font-family:'Archivo', Arial, sans-serif; font-weight:600; letter-spacing:0.22em; }
    </style>
  </defs>

  <!-- monogramme -->
  <g>
    <circle cx="60" cy="60" r="56" fill="url(#etain)"/>
    <circle cx="60" cy="60" r="49.5" fill="none" stroke="url(#ring)" stroke-width="5"/>
    <circle cx="60" cy="60" r="42" fill="url(#verm)"/>
    <circle cx="60" cy="60" r="36.5" fill="none" stroke="#B98A2F" stroke-width="1.2" opacity="0.9"/>
    <path d="M 42 76 L 42 46 L 60 66 L 78 46 L 78 76"
          fill="none" stroke="#FFFFFF" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- nom -->
  <text class="wordmark" x="140" y="71" font-size="46" fill="#1E2430">Metalboxes</text>
  <!-- tagline -->
  <text class="tagline" x="142" y="94" font-size="12.5" fill="#5A6170">EMBALLAGES MÉTALLIQUES PERSONNALISÉS</text>
</svg>
